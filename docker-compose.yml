services:
  fastomop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastomop
    restart: unless-stopped

    ports:
      - "7777:7777"

    environment:
      # OpenRouter
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}

      # Database
      - DB_TYPE=duckdb
      - DB_PATH=/app/data/synthetic_snuh.duckdb

      # Required: web_interface.py refuses to start without this (see
      # agno_fastomop/.env.example). Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - OS_SECURITY_KEY=${OS_SECURITY_KEY}

      # Langfuse disabled
      - LANGFUSE_PUBLIC_KEY=disabled
      - LANGFUSE_SECRET_KEY=disabled
      - LANGFUSE_HOST=http://localhost:7777

      # Tracing disabled
      - OTEL_SDK_DISABLED=true

    volumes:
      # DuckDB data file
      - ${DB_HOST_PATH:-../data}:/app/data:ro

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
