<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CausalOMOP governed causal-study workflow</title>
  <desc id="desc">A publication-ready overview from a clinical question to an auditable causal report, with human approval gates and governed OMOP data access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563a8"/></marker>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.box{stroke-width:1.8;rx:8;ry:8}.impl{fill:#e3f1e4;stroke:#4f8b5e}.review{fill:#fff2cc;stroke:#bd8a1c}.advisory{fill:#f2e7f6;stroke:#8d68a6}.external{fill:#e5f0fb;stroke:#4e80b8}.data{fill:#e8f1fb;stroke:#4e80b8}.line{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563a8;stroke-width:2;marker-end:url(#arrowBlue)}.panel{fill:#fbfcfe;stroke:#9ca3af;stroke-width:1.5;rx:12;ry:12}.legend{font-size:14px}.label{font-size:14px;font-weight:700;fill:#4b5563}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="white"/>
  <text x="55" y="55" class="t h">CausalOMOP: governed workflow for causal studies over OMOP data</text>
  <text x="55" y="82" class="t s">Solid arrows: implemented workflow. Dashed arrows: human review or advisory/external input.</text>

  <rect x="50" y="115" width="1500" height="190" class="panel"/>
  <text x="75" y="150" class="t h">1. Question and causal-study design</text>
  <rect x="90" y="185" width="180" height="58" class="box advisory"/><text x="180" y="210" text-anchor="middle" class="t s">Clinical question</text><text x="180" y="231" text-anchor="middle" class="t xs">researcher input</text>
  <path d="M270 214 H330" class="line"/>
  <polygon points="390,174 450,214 390,254 330,214" class="review" stroke="#bd8a1c" stroke-width="1.8"/><text x="390" y="209" text-anchor="middle" class="t xs">Causal</text><text x="390" y="225" text-anchor="middle" class="t xs">question?</text>
  <path d="M450 214 H520" class="line"/>
  <rect x="520" y="185" width="205" height="58" class="box impl"/><text x="622" y="209" text-anchor="middle" class="t s">Question &amp; hypothesis</text><text x="622" y="230" text-anchor="middle" class="t xs">drafting service</text>
  <path d="M725 214 H785" class="line"/>
  <rect x="785" y="177" width="205" height="74" class="box impl"/><text x="887" y="202" text-anchor="middle" class="t s">Target trial, DAG &amp;</text><text x="887" y="223" text-anchor="middle" class="t s">identification checks</text><text x="887" y="242" text-anchor="middle" class="t xs">candidate study specification</text>
  <path d="M990 214 H1050" class="line"/>
  <rect x="1050" y="177" width="225" height="74" class="box review"/><text x="1162" y="202" text-anchor="middle" class="t s">Human scientific review</text><text x="1162" y="223" text-anchor="middle" class="t xs">target trial · DAG · estimand</text><text x="1162" y="241" text-anchor="middle" class="t xs">three approval gates</text>
  <path d="M1275 214 H1425" class="line"/>
  <rect x="1425" y="185" width="90" height="58" class="box impl"/><text x="1470" y="208" text-anchor="middle" class="t xs">Study</text><text x="1470" y="226" text-anchor="middle" class="t xs">specification</text>
  <path d="M622 185 V145 H760" class="dash"/><rect x="760" y="120" width="220" height="50" class="box external"/><text x="870" y="142" text-anchor="middle" class="t xs">PubMed · OpenAlex · OptimusKG</text><text x="870" y="158" text-anchor="middle" class="t xs">retrieved evidence only</text>
  <path d="M390 254 V280 H330" class="dash"/>
  <rect x="80" y="263" width="250" height="36" class="box external"/><text x="205" y="286" text-anchor="middle" class="t xs">FastOMOP: descriptive NL-to-SQL workflow</text>

  <rect x="50" y="335" width="950" height="520" class="panel"/>
  <text x="75" y="370" class="t h">2. OMOP operationalization, estimation and reporting</text>
  <rect x="90" y="410" width="200" height="68" class="box impl"/><text x="190" y="435" text-anchor="middle" class="t s">Concept sets &amp; variable</text><text x="190" y="456" text-anchor="middle" class="t s">registry</text>
  <path d="M290 444 H340" class="line"/>
  <rect x="340" y="410" width="190" height="68" class="box review"/><text x="435" y="435" text-anchor="middle" class="t s">Clinical mapping</text><text x="435" y="456" text-anchor="middle" class="t s">review gate</text>
  <path d="M530 444 H580" class="line"/>
  <rect x="580" y="410" width="220" height="68" class="box impl"/><text x="690" y="435" text-anchor="middle" class="t s">Feasibility, follow-up,</text><text x="690" y="456" text-anchor="middle" class="t s">positivity &amp; missingness audits</text>
  <path d="M800 444 H850" class="line"/>
  <rect x="850" y="410" width="115" height="68" class="box review"/><text x="907" y="435" text-anchor="middle" class="t xs">Analysis-plan</text><text x="907" y="455" text-anchor="middle" class="t xs">gate</text>

  <path d="M907 478 V545 H190" class="line"/>
  <rect x="90" y="545" width="200" height="68" class="box impl"/><text x="190" y="570" text-anchor="middle" class="t s">Analytic-cohort SQL plan</text><text x="190" y="592" text-anchor="middle" class="t xs">and cohort manifest</text>
  <path d="M290 579 H340" class="line"/>
  <rect x="340" y="545" width="190" height="68" class="box review"/><text x="435" y="570" text-anchor="middle" class="t s">Statistical-estimand</text><text x="435" y="592" text-anchor="middle" class="t s">gate</text>
  <path d="M530 579 H580" class="line"/>
  <rect x="580" y="545" width="220" height="68" class="box impl"/><text x="690" y="570" text-anchor="middle" class="t s">Governed materialization</text><text x="690" y="592" text-anchor="middle" class="t xs">analytic dataset (local)</text>
  <path d="M800 579 H850" class="line"/>
  <rect x="850" y="545" width="115" height="68" class="box impl"/><text x="907" y="570" text-anchor="middle" class="t xs">G-computation</text><text x="907" y="590" text-anchor="middle" class="t xs">ATE baseline</text>

  <path d="M907 613 V680 H190" class="line"/>
  <rect x="90" y="680" width="200" height="68" class="box impl"/><text x="190" y="705" text-anchor="middle" class="t s">Balance &amp; calibration</text><text x="190" y="727" text-anchor="middle" class="t s">diagnostics</text>
  <path d="M290 714 H340" class="line"/>
  <rect x="340" y="680" width="190" height="68" class="box review"/><text x="435" y="705" text-anchor="middle" class="t s">Results-review gate</text><text x="435" y="727" text-anchor="middle" class="t xs">human sign-off</text>
  <path d="M530 714 H580" class="line"/>
  <rect x="580" y="680" width="220" height="68" class="box impl"/><text x="690" y="705" text-anchor="middle" class="t s">Auditable causal report</text><text x="690" y="727" text-anchor="middle" class="t xs">assumptions, provenance, results</text>
  <text x="90" y="805" class="t xs">Implemented baseline only: binary-outcome ATE on the risk-difference scale. TMLE, CATE, IPCW, negative controls and quantitative sensitivity analysis are not implemented.</text>

  <rect x="1040" y="335" width="510" height="520" class="panel"/>
  <text x="1065" y="370" class="t h">Governed data boundary</text>
  <rect x="1110" y="420" width="180" height="62" class="box external"/><text x="1200" y="445" text-anchor="middle" class="t s">OMOP CDM</text><text x="1200" y="466" text-anchor="middle" class="t xs">BigQuery or local DuckDB</text>
  <path d="M1200 482 V535" class="blue"/>
  <rect x="1090" y="535" width="220" height="72" class="box external"/><text x="1200" y="561" text-anchor="middle" class="t s">OMCP governed server</text><text x="1200" y="582" text-anchor="middle" class="t xs">authorization + read-only SQL</text>
  <path d="M1200 607 V660" class="blue"/>
  <rect x="1090" y="660" width="220" height="62" class="box impl"/><text x="1200" y="685" text-anchor="middle" class="t s">CausalOMOP workflow</text><text x="1200" y="706" text-anchor="middle" class="t xs">gates and audit artifacts</text>
  <path d="M1310 692 H1460 V470 H1390" class="dash"/>
  <rect x="1350" y="420" width="150" height="62" class="box advisory"/><text x="1425" y="445" text-anchor="middle" class="t s">LLM providers</text><text x="1425" y="466" text-anchor="middle" class="t xs">draft JSON only</text>
  <text x="1090" y="758" class="t xs">FastOMOP also uses this OMCP boundary, but only the</text><text x="1090" y="777" class="t xs">descriptive Select_Query surface (not Causal_Select_Query).</text>
  <text x="1090" y="810" class="t s" font-weight="700">Privacy invariant</text><text x="1090" y="837" class="t xs">Patient-level analytic data are never sent to LLM providers.</text>

  <rect x="60" y="920" width="20" height="20" class="impl"/><text x="90" y="936" class="t legend">Implemented component</text>
  <rect x="290" y="920" width="20" height="20" class="review"/><text x="320" y="936" class="t legend">Human review / approval gate</text>
  <rect x="595" y="920" width="20" height="20" class="advisory"/><text x="625" y="936" class="t legend">Advisory input</text>
  <rect x="790" y="920" width="20" height="20" class="external"/><text x="820" y="936" class="t legend">External system or data source</text>
  <text x="60" y="990" class="t xs">Figure 1. CausalOMOP separates scientific design, OMOP operationalization, and governed data execution; human approval is required at each decision gate.</text>
</svg>
