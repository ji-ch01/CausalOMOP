name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-bigquery.txt
          pip install -r requirements-llm.txt
          pip install -r requirements-ui.txt
          pip install -r requirements-mcp.txt
          pip install -r requirements-causal-discovery.txt
          pip install -r requirements-knowledge-graph.txt
          pip install -r requirements-estimation.txt
          pip install pytest pytest-timeout

      - name: Run tests
        # `slow` (the maintainer-only simulation replicates) is deselected by
        # pytest.ini's addopts; the slow-tests job below runs it separately.
        run: python -m pytest tests/ -q --timeout=300

  # The `slow` simulation suite (tests/test_simulation.py -- real estimators
  # fit over many replicates) is deselected from the main job so a local
  # `pytest` stays fast; run it here so a bias/coverage regression still has
  # CI. Longer timeout: a single replicate set is minutes, not seconds.
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-estimation.txt
          pip install pytest pytest-timeout

      - name: Run slow tests
        run: python -m pytest tests/ -q -m slow --timeout=1800

  # `omcp` and `agno_fastomop` are separate repos (git submodules, see
  # .gitmodules) that each declare `requires-python = ">=3.13"` and manage
  # their own dependencies via uv -- installing them into the 3.12 `pytest`
  # job above isn't viable, so they get their own jobs on the same trigger.
  # Without these, a regression in either submodule (e.g. the OMCP SQL
  # validator letting a stacked statement through) has no CI to catch it.
  omcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v9

      - name: Run OMCP test suite
        working-directory: omcp
        run: |
          uv sync --group dev
          uv run pytest tests/ -q

  fastomop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v9

      - name: Run FastOMOP test suite
        working-directory: agno_fastomop
        run: |
          uv sync --extra dev
          uv run pytest tests/ -q

  # Static security scan (bandit) over the two places that build and execute
  # SQL against real OMOP patient data: `omcp/src` (the governed query
  # server -- the SQL-validator stacked-statement bug this project already
  # shipped once lived here) and `causal` (the SQL-generating query
  # builders). Gated at high severity only: `-lll` reports zero issues on
  # this codebase today, so the gate starts clean and catches a real
  # regression (e.g. a new `eval`/`shell=True`/hardcoded-credential pattern)
  # without blocking on the ~45 preexisting medium-severity, low-confidence
  # findings (mostly f-string-built SQL against server-side config values,
  # e.g. schema/project names -- not user input) that would need individual
  # triage to either fix or annotate `# nosec`. Those are still surfaced,
  # non-blocking, in the second step so they stay visible instead of
  # silently uninvestigated.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Bandit -- fail on high-severity findings
        run: python -m bandit -r omcp/src causal -x "*/.venv/*,*/tests/*" -lll

      - name: Bandit -- report medium+ severity findings (non-blocking)
        if: always()
        run: python -m bandit -r omcp/src causal -x "*/.venv/*,*/tests/*" -ll || true
