[pytest]
# Only collect the project's own suite: a bare `pytest` from the repo root
# otherwise descends into the submodules (agno_fastomop/, omcp/), whose
# conftests need plugins this env does not install.
testpaths = tests
# `slow` and `heavy` are opt-in, so deselect both by default. A command-line
# `-m` overrides this whole expression (the later -m wins), so `pytest -m slow`
# or `pytest -m heavy` runs only that set.
addopts = -m "not slow and not heavy"
markers =
    slow: opt-in, maintainer-only tests (e.g. tests/test_simulation.py) that fit real estimators over many replicates; run explicitly with -m slow.
    heavy: opt-in tests that fit a real cross-validated SuperLearner ensemble / causal forest (TMLE + nuisance recovery). Correctness-critical but multi-second each; run in CI's heavy-tests job and locally with -m heavy.
