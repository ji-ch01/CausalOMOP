[pytest]
# Only collect the project's own suite: a bare `pytest` from the repo root
# otherwise descends into the submodules (agno_fastomop/, omcp/), whose
# conftests need plugins this env does not install.
testpaths = tests
# `slow` is opt-in, so deselect it by default. `pytest -m slow` on the
# command line overrides this (the later -m wins) to run only the slow set.
addopts = -m "not slow"
markers =
    slow: opt-in, maintainer-only tests (e.g. tests/test_simulation.py) that fit real estimators over many replicates; run explicitly with -m slow.
