# Tooling configuration only. CausalOMOP is run from a checkout (its
# dependencies live in the `requirements-*.txt` files, see the README), not
# installed as a distribution, so there is deliberately no `[build-system]`
# or `[project]` table here yet -- this file exists to hold the linter
# config. `pytest` config stays in `pytest.ini`.

[tool.ruff]
target-version = "py312"
# The code is written to ~120 columns. E501 itself is not enforced (see
# `ignore` below); this is kept so `ruff format`, if it is ever run, wraps
# to the width the codebase already uses instead of the 88-column default.
line-length = 120
# The submodules (see .gitmodules) are separate repos with their own
# `pyproject.toml`, Python version and lint rules -- never lint them from
# here. `src/` is a stale local prototype directory, not part of the package.
extend-exclude = [
    "agno_fastomop",
    "omcp",
    "foem",
    "external",
    "src",
    "notebooks",
    "work",
    "paper",
]

[tool.ruff.lint]
# A deliberately small, high-signal rule set:
#   F  (pyflakes)        -- undefined names, unused imports/variables: real breakage
#   E  (pycodestyle)     -- syntax-adjacent style; E501 delegated to the formatter
#   B  (flake8-bugbear)  -- likely bugs: late-binding closures, `raise` without
#                           `from`, `zip` without `strict`, mutable defaults, ...
# Enabling this set surfaced 53 findings (0 latent bugs -- every B finding was a
# false positive or a style nit); they are fixed or annotated `# noqa: <code>`
# with a one-line reason at the call site.
select = ["E", "F", "B"]
# Line length is a formatter's job, not a linter's. Enforcing E501 here would
# flag ~40 pre-existing lines whose only fix is hand-wrapping, with no
# correctness value; `ruff format` (or `black`) can reflow them in one pass if
# that is ever wanted.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `streamlit run causal/ui/streamlit_app.py` puts `causal/ui/` on `sys.path`
# rather than the repo root, so the `causal.*` imports have to come after a
# `sys.path.insert()` shim at the top of the file (documented there). That is
# the one legitimate reason for module-level imports below code in this repo.
"causal/ui/streamlit_app.py" = ["E402"]
